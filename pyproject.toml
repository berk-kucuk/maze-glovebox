[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-glovebox"
version = "1.0.0"
description = "Maze Glovebox — open a suspicious file in a sealed box: no network, none of your files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "berkkucukk", email = "berkkucukk@proton.me" }]
dependencies = ["PyQt6>=6.6.0"]

[project.urls]
Homepage = "https://mazelinux.berkkucukk.com.tr"

[project.scripts]
maze-glovebox = "mazeglovebox.gui.app:run"

[tool.setuptools.packages.find]
include = ["mazeglovebox*"]
