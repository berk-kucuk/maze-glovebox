<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Maze Glovebox</title>
  <!-- Maze Glovebox: the Maze family's square frame as a sealed box, a document
       held inside it, and the two round glove ports below — you can handle
       what is in the box without it ever touching you. Black and white. -->
  <defs>
    <radialGradient id="mg-glow" cx="512" cy="430" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mg-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcfd8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="#000"/>
  <circle cx="512" cy="430" r="360" fill="url(#mg-glow)"/>
  <rect x="245" y="245" width="534" height="534" fill="none" stroke="#f2f2f4"
        stroke-width="46" stroke-linejoin="miter"/>
  <!-- the document inside -->
  <path d="M432 318 H560 L608 366 V528 H432 Z" fill="url(#mg-lit)"/>
  <path d="M560 318 V366 H608" fill="none" stroke="#000" stroke-width="12"/>
  <rect x="464" y="402" width="112" height="14" fill="#000"/>
  <rect x="464" y="436" width="112" height="14" fill="#000"/>
  <rect x="464" y="470" width="76" height="14" fill="#000"/>
  <!-- the two glove ports, and the gloves reaching in to hold the document -->
  <path d="M392 640 C392 590 420 560 452 548" fill="none" stroke="#8a8a92"
        stroke-width="34" stroke-linecap="round"/>
  <path d="M632 640 C632 590 604 560 572 548" fill="none" stroke="#8a8a92"
        stroke-width="34" stroke-linecap="round"/>
  <circle cx="392" cy="676" r="52" fill="#000" stroke="#f2f2f4" stroke-width="28"/>
  <circle cx="632" cy="676" r="52" fill="#000" stroke="#f2f2f4" stroke-width="28"/>
</svg>
